name: Secret Scan

on:
  push:
    branches: [master]
  # No base-branch filter: a stacked PR targets the branch below it, not
  # master, and a `branches:` filter here silently gave those PRs no CI at
  # all -- code reached master having only ever been built locally.
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
