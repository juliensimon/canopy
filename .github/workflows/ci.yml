name: CI

on:
  push:
    branches: [master]
  # No base-branch filter: a stacked PR targets the branch below it, not
  # master, and a `branches:` filter here silently gave those PRs no CI at
  # all -- code reached master having only ever been built locally.
  pull_request:

jobs:
  build-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Xcode 26+ ships without the Metal compiler; it is a separately
      # downloaded component. SwiftTerm resource-processes
      # Apple/Metal/Shaders.metal, so *both* `swift build` and `xcodebuild
      # archive` invoke `metal` and fail with "cannot execute tool 'metal'" on
      # any image whose Xcode lacks it. Xcode 16 bundles the compiler, so the
      # guard keeps this a no-op until the runner image moves on.
      - name: Ensure Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: swift build -c release

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Export coverage to lcov
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build --show-bin-path)"
          PROF_DATA="${BIN_PATH}/codecov/default.profdata"
          XCTEST_BUNDLE="$(find "${BIN_PATH}" -name '*.xctest' -print -quit)"
          XCTEST_NAME="$(basename "${XCTEST_BUNDLE}" .xctest)"
          XCTEST_BIN="${XCTEST_BUNDLE}/Contents/MacOS/${XCTEST_NAME}"
          xcrun llvm-cov export \
            -format=lcov \
            -instr-profile "${PROF_DATA}" \
            -ignore-filename-regex='.build|Tests|Views|CanopyApp' \
            "${XCTEST_BIN}" > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
